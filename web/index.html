<head>

<link rel="stylesheet" href="css/masken.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>
  (function () { var d = document.documentElement, p = null;
    try { p = JSON.parse(localStorage.getItem('opl.darstellung') || 'null'); if (!p) { var t = JSON.parse(localStorage.getItem('opl.theme') || 'null'); if (t) p = { modus: t }; } } catch (e) {}
    p = p || {}; d.dataset.design = p.design || 'klassik';
    if (p.modus === 'light' || p.modus === 'dark') d.dataset.theme = p.modus;
    d.dataset.scheme = d.dataset.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<div id="root"><div class="loading"><span class="spinner"></span>Lädt …</div></div>
<div id="toasts" aria-live="polite"></div>
<noscript>Bitte JavaScript aktivieren.</noscript>
<script type="module" src="js/app.js"></script>
</body>
